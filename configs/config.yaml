seed: 42
split:
  test_size: 0.20          # untouched holdout
  calibration_size: 0.25   # share of the development set used only for calibration/threshold selection
cv:
  folds: 5
  sample_n: 120000         # rows used for CV model comparison (None = all); keeps Colab runtime bounded
models: [dummy, logreg, random_forest, xgboost, lightgbm]
selected_model: auto       # auto = best CV ROC-AUC among non-dummy models, or name a model
use_smote: false           # SMOTE only inside training pipeline if true; off by default
tuning:
  optuna_trials: 0         # 0 = no tuning (baseline-first)
features:
  max_missing_frac: 0.75
  corr_prune_threshold: 0.98
  exclude_from_model: [CODE_GENDER]   # sensitive attribute kept only for fairness audit
risk_bands:                # illustrative starting thresholds, NOT industry-approved cutoffs
  LOW: [0.00, 0.05]
  MEDIUM: [0.05, 0.15]
  HIGH: [0.15, 0.30]
  VERY_HIGH: [0.30, 1.01]
recommendations:
  LOW: Further assessment
  MEDIUM: Manual review
  HIGH: Enhanced review
  VERY_HIGH: Escalated review
ecl:
  lgd_scenarios: {optimistic: 0.25, base: 0.45, conservative: 0.65}   # assumptions, not dataset values
monitoring:
  psi_warn: 0.10
  psi_alert: 0.25
  missing_shift_warn: 0.05
  mean_pd_shift_warn: 0.20   # relative
fairness:
  min_group_size: 300
